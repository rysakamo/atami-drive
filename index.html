<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026年11月29日の熱海日帰りドライブに向けた、観光スポット10件の比較ガイド。">
  <meta name="theme-color" content="#123b40">
  <title>熱海、どこ行く？｜11.29 日帰りドライブ</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./spots.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="hero-content">
        <p class="eyebrow"><time datetime="2026-11-29">2026.11.29 SUN</time> / ATAMI DRIVE</p>
        <h1>熱海、どこ行く？</h1>
        <p>友人5人の日帰りドライブ。写真と予算で、行きたい場所を見つけよう。</p>
        <nav aria-label="ページ内ナビゲーション">
          <a href="#spots">スポットを比較</a>
          <a href="#area-map">地図を見る</a>
        </nav>
      </div>
    </header>

    <section id="spots" aria-labelledby="spots-heading">
      <h2 id="spots-heading">観光スポットを比較</h2>
      <p class="section-note">予算は大人1人分の入場・往復乗車料で比較します。駐車料、飲食代は別途。滞在時間は計画用の目安です。</p>
      <div class="filters">
        <label for="genre">ジャンル
          <select id="genre">
            <option value="">すべて</option>
          </select>
        </label>
        <label for="budget">予算
          <select id="budget">
            <option value="">すべて</option>
            <option value="0">無料</option>
            <option value="1000">1,000円以下</option>
            <option value="2000">2,000円以下</option>
            <option value="over">2,000円超</option>
            <option value="unknown">当日料金は要確認</option>
          </select>
        </label>
        <button type="button" id="reset">絞り込みを解除</button>
      </div>
      <p id="count" role="status"></p>
      <div id="cards" class="grid"></div>
      <noscript>カードと地図を表示するには JavaScript を有効にしてください。</noscript>
    </section>

    <section id="area-map" aria-labelledby="map-heading">
      <h2 id="map-heading">候補地マップ</h2>
      <p class="section-note">10スポットの位置関係を示す概略図です。番号をタップするとカードへ移動します。</p>
      <div id="map" class="map" aria-label="熱海周辺の概略図">
        <div class="sea" aria-hidden="true"></div>
        <span class="north" aria-hidden="true">↑ 北</span>
        <span class="bay" aria-hidden="true">相模灘</span>
        <span class="town" aria-hidden="true">熱海市街</span>
      </div>
      <ol id="map-key" class="map-key" aria-label="地図のスポット一覧"></ol>
    </section>

    <footer>料金・営業状況は各施設や観光協会の案内でご確認ください。</footer>
  </main>
</body>
</html>
